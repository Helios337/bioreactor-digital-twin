name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The raw IndPenSim dataset is large and is never required for the tests.
      - name: Install package (data-independent build)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run data-independent test suite
        run: |
          python -m pytest tests/ -q